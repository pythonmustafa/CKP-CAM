<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Trigger Library Viewer</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Consolas', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: #1a1a1a;
            padding: 0 20px;
            height: 50px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 { margin: 0; color: #4db8ff; font-size: 16px; display: flex; align-items: center; gap: 15px; }
        .legend { display: flex; gap: 10px; font-size: 11px; }
        .legend span { padding: 3px 8px; border-radius: 4px; font-weight: bold; color: #000; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* SOL PANEL */
        .input-panel {
            width: 300px;
            background: #181818;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 10px;
            z-index: 10;
        }

        textarea {
            flex: 1;
            background: #0d0d0d;
            color: #6a9;
            border: 1px solid #333;
            padding: 10px;
            font-family: monospace;
            font-size: 10px;
            resize: none;
            outline: none;
            white-space: pre;
        }

        .action-btn {
            margin-top: 10px;
            background: #2ea44f;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .action-btn:hover { background: #2c974b; }

        /* SAĞ PANEL */
        .visualizer-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            overflow: hidden;
        }

        .toolbar {
            background: #222;
            padding: 5px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
            height: 40px;
        }

        select {
            background: #333; color: #fff; padding: 4px;
            border: 1px solid #555; border-radius: 4px; min-width: 300px;
            font-size: 12px; font-family: monospace;
        }

        .scroll-wrapper {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            background: #050505;
            cursor: crosshair;
        }

        /* Scrollbar */
        .scroll-wrapper::-webkit-scrollbar { height: 14px; }
        .scroll-wrapper::-webkit-scrollbar-track { background: #111; }
        .scroll-wrapper::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; border: 3px solid #111; }
        .scroll-wrapper::-webkit-scrollbar-thumb:hover { background: #666; }

        canvas { display: block; }

        /* TOOLTIP */
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #fff;
            padding: 8px;
            pointer-events: none;
            display: none;
            font-size: 11px;
            z-index: 1000;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .tt-row { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 2px; align-items: center; }
        .status-badge { font-weight: bold; padding: 1px 4px; border-radius: 2px; color: #000; font-size: 10px; }
        .on { opacity: 1; }
        .off { opacity: 0.3; background: #fff !important; }
    </style>
</head>

        <button class="action-btn" onclick="parseAndLoadPatterns()">HEPSİNİ LİSTELE</button>
    </div>

    <div class="visualizer-panel">
        <div class="toolbar">
            <select id="patternSelect" onchange="renderGraph()">
                <option value="">-- Veri Yükleniyor... --</option>
            </select>
            <div style="flex:1"></div>
            <label style="font-size:12px; color:#aaa;">Zoom:</label>
            <input type="range" id="zoomRange" min="5" max="150" value="25" style="width:120px;" oninput="renderGraph()">
        </div>

        <div class="scroll-wrapper" id="scrollContainer">
            <canvas id="scopeCanvas" height="400"></canvas>
            <div id="tooltip"></div>
        </div>
    </div>
</div>

<script>
    let patternLibrary = {};
    let currentData = [];
    const canvas = document.getElementById('scopeCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const scrollContainer = document.getElementById('scrollContainer');

    function parseAndLoadPatterns() {
        const text = document.getElementById('bulkCode').value;
        const selectBox = document.getElementById('patternSelect');
        const statusDiv = document.getElementById('status');
        
        patternLibrary = {}; 
        selectBox.innerHTML = "";
        
        // Regex: C++ Array yapısını yakalar
        // "unsigned char" anahtar kelimesini özellikle arıyoruz.
        const regex = /const\s+unsigned\s+char\s+(\w+)\[\][^=]*=\s*\{([\s\S]*?)\};/g;
        let match;
        let count = 0;

        while ((match = regex.exec(text)) !== null) {
            const name = match[1];
            let rawData = match[2];
            // Yorumları temizle
            rawData = rawData.replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, '');
            // Sayıları al
            const numbers = rawData.match(/\d+/g);
            
            if (numbers) {
                patternLibrary[name] = numbers.map(Number);
                const option = document.createElement("option");
                option.value = name;
                option.text = name;
                selectBox.appendChild(option);
                count++;
            }
        }
        
        if (count > 0) {
            statusDiv.innerHTML = `<span style="color:#4dff4d">✅ ${count} desen hazır.</span>`;
            selectBox.selectedIndex = 0;
            renderGraph();
        } else {
            statusDiv.innerHTML = `⚠️ Veri bulunamadı.`;
        }
    }

    function renderGraph() {
        const selectBox = document.getElementById('patternSelect');
        const name = selectBox.value;
        
        if (!name || !patternLibrary[name]) {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            return;
        }

        currentData = patternLibrary[name];
        const stepSize = parseInt(document.getElementById('zoomRange').value);

        const totalWidth = currentData.length * stepSize + 100;
        const containerWidth = scrollContainer.clientWidth;
        canvas.width = Math.max(containerWidth, totalWidth);
        
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawGrid(canvas.width, canvas.height, stepSize);

        // --- YÜKSEKLİK AYARLARI (İSTEDİĞİN SIRA) ---
        // ÜST: CRANK (Bit 0) - MAVİ
        // ORTA: CAM 1 (Bit 1) - SARI
        // ALT: CAM 2 (Bit 2) - MOR
        
        const crankY = 60;   // EN ÜST
        const cam1Y  = 180;  // ORTA
        const cam2Y  = 300;  // ALT
        const h = 40;        // Pulse yüksekliği

        ctx.lineWidth = 2;

        // CHANNEL 1: CRANK (Bit 0 = 1)
        ctx.strokeStyle = "#00d2ff"; // Cyan
        drawChannel(currentData, stepSize, crankY, h, 1, "CRANK (CKP)");

        // CHANNEL 2: CAM 1 (Bit 1 = 2)
        ctx.strokeStyle = "#ffeb3b"; // Yellow
        drawChannel(currentData, stepSize, cam1Y, h, 2, "CAM 1");

        // CHANNEL 3: CAM 2 (Bit 2 = 4)
        ctx.strokeStyle = "#ff00ff"; // Magenta
        drawChannel(currentData, stepSize, cam2Y, h, 4, "CAM 2");
    }

    function drawChannel(data, step, baseY, height, bitMask, label) {
        ctx.beginPath();
        
        // İlk değer
        let firstActive = (data[0] & bitMask) !== 0;
        ctx.moveTo(0, firstActive ? baseY : baseY + height);

        for (let i = 0; i < data.length; i++) {
            let x = i * step;
            let isActive = (data[i] & bitMask) !== 0;
            let y = isActive ? baseY : baseY + height;
            
            ctx.lineTo(x + step, y); // Yatay
            
            // Dikey (değişim varsa)
            if (i < data.length - 1) {
                let nextActive = (data[i+1] & bitMask) !== 0;
                let nextY = nextActive ? baseY : baseY + height;
                if (y !== nextY) ctx.lineTo(x + step, nextY);
            }
        }
        ctx.stroke();

        // Etiket
        ctx.fillStyle = ctx.strokeStyle;
        ctx.font = "bold 12px Consolas";
        ctx.fillText(label, 10, baseY - 10);
    }

    function drawGrid(w, h, step) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < w; x += step) {
            ctx.moveTo(x, 0); ctx.lineTo(x, h);
        }
        ctx.stroke();
        
        // Kanal ayraçları
        ctx.strokeStyle = "#333";
        ctx.beginPath();
        ctx.moveTo(0, 130); ctx.lineTo(w, 130);
        ctx.moveTo(0, 250); ctx.lineTo(w, 250);
        ctx.stroke();
    }

    canvas.addEventListener('mousemove', function(e) {
        if (!currentData.length) return;
        
        const stepSize = parseInt(document.getElementById('zoomRange').value);
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const index = Math.floor(x / stepSize);

        if (index >= 0 && index < currentData.length) {
            renderGraph(); // Temizle

            const drawX = index * stepSize;
            
            // Cursor
            ctx.strokeStyle = "white";
            ctx.setLineDash([2, 2]);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(drawX + stepSize/2, 0);
            ctx.lineTo(drawX + stepSize/2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            const val = currentData[index];
            const isCrank = (val & 1) !== 0;
            const isCam1 = (val & 2) !== 0;
            const isCam2 = (val & 4) !== 0;

            tooltip.style.display = "block";
            let toolX = e.clientX + 20;
            if (toolX + 130 > window.innerWidth) toolX -= 150;

            tooltip.style.left = toolX + "px";
            tooltip.style.top = (e.clientY + 20) + "px";
            
            tooltip.innerHTML = `
                <div style="font-weight:bold; border-bottom:1px solid #ddd; margin-bottom:5px;">
                    Index: ${index} | Val: ${val}
                </div>
                <div class="tt-row ${isCrank ? 'on':'off'}" style="color:#00d2ff">
                    <span>CKP</span> <span class="status-badge" style="background:${isCrank ? '#00d2ff':'#fff'}">${isCrank ? 'HI' : 'LO'}</span>
                </div>
                <div class="tt-row ${isCam1 ? 'on':'off'}" style="color:#ffeb3b">
                    <span>CAM1</span> <span class="status-badge" style="background:${isCam1 ? '#ffeb3b':'#fff'}">${isCam1 ? 'HI' : 'LO'}</span>
                </div>
                <div class="tt-row ${isCam2 ? 'on':'off'}" style="color:#ff00ff">
                    <span>CAM2</span> <span class="status-badge" style="background:${isCam2 ? '#ff00ff':'#fff'}">${isCam2 ? 'HI' : 'LO'}</span>
                </div>
            `;
        }
    });

    canvas.addEventListener('mouseout', () => {
        tooltip.style.display = "none";
        renderGraph();
    });

    // Sayfa açıldığında otomatik yükle
    window.onload = parseAndLoadPatterns;

</script>

</body>
</html>
